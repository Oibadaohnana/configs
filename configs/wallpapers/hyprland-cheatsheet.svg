<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11111b"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff8800" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff8800" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0"/>
    </radialGradient>
    <style>
      .card   { fill: #24243a; fill-opacity: 0.55; stroke: #45475a; stroke-width: 1.5; }
      .header { font-family: 'Liberation Sans'; font-weight: bold; font-size: 27px; fill: #89b4fa; letter-spacing: 1px; }
      .rule   { stroke: #45475a; stroke-width: 1.5; }
      .key    { font-family: 'Hack'; font-weight: bold; font-size: 22px; fill: #ff9a3d; }
      .desc   { font-family: 'Liberation Sans'; font-size: 19px; fill: #cdd6f4; }
      .title  { font-family: 'Liberation Sans'; font-weight: bold; font-size: 76px; fill: #ff8800; letter-spacing: 6px; }
      .subtitle { font-family: 'Liberation Sans'; font-size: 26px; fill: #89b4fa; letter-spacing: 3px; }
      .footer { font-family: 'Hack'; font-size: 18px; fill: #6c7086; }
    </style>
  </defs>

  <rect x="0" y="0" width="2560" height="1440" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="500" fill="url(#glow1)"/>
  <circle cx="2360" cy="1300" r="600" fill="url(#glow2)"/>

  <text x="1280" y="100" text-anchor="middle" class="title">HYPRLAND</text>
  <text x="1280" y="140" text-anchor="middle" class="subtitle">KEYBOARD SHORTCUTS  ·  SUPER = MOD KEY</text>
  <line x1="100" y1="168" x2="2460" y2="168" class="rule"/>

  <rect x="78" y="196" width="604" height="536" rx="16" class="card"/><rect x="78" y="744" width="604" height="246" rx="16" class="card"/><rect x="78" y="1002" width="604" height="130" rx="16" class="card"/><rect x="678" y="196" width="604" height="478" rx="16" class="card"/><rect x="678" y="686" width="604" height="130" rx="16" class="card"/><rect x="678" y="828" width="604" height="188" rx="16" class="card"/><rect x="1278" y="196" width="604" height="304" rx="16" class="card"/><rect x="1278" y="512" width="604" height="188" rx="16" class="card"/><rect x="1278" y="712" width="604" height="188" rx="16" class="card"/><rect x="1278" y="912" width="604" height="246" rx="16" class="card"/><rect x="1878" y="196" width="604" height="304" rx="16" class="card"/><rect x="1878" y="512" width="604" height="130" rx="16" class="card"/><rect x="1878" y="654" width="604" height="536" rx="16" class="card"/>
  <text x="100" y="240" class="header">APPLICATIONS</text><line x1="100" y1="252" x2="660" y2="252" class="rule"/><text x="100" y="284" class="key">SUPER + Return</text><text x="100" y="310" class="desc">Open terminal (kitty)</text><text x="100" y="342" class="key">SUPER + F2</text><text x="100" y="368" class="desc">Open Firefox</text><text x="100" y="400" class="key">SUPER + F1</text><text x="100" y="426" class="desc">Open volume mixer</text><text x="100" y="458" class="key">SUPER + F3</text><text x="100" y="484" class="desc">Open Bluetooth manager</text><text x="100" y="516" class="key">SUPER + F4</text><text x="100" y="542" class="desc">Open display manager</text><text x="100" y="574" class="key">SUPER + D</text><text x="100" y="600" class="desc">Open app launcher (rofi)</text><text x="100" y="632" class="key">SUPER + V</text><text x="100" y="658" class="desc">Show clipboard history</text><text x="100" y="690" class="key">SUPER + End</text><text x="100" y="716" class="desc">Toggle gaming display</text><text x="100" y="788" class="header">SESSION</text><line x1="100" y1="800" x2="660" y2="800" class="rule"/><text x="100" y="832" class="key">SUPER + L</text><text x="100" y="858" class="desc">Lock screen</text><text x="100" y="890" class="key">Ctrl + Alt + Del</text><text x="100" y="916" class="desc">Logout menu</text><text x="100" y="948" class="key">SUPER + Shift + P</text><text x="100" y="974" class="desc">Shut down</text><text x="100" y="1046" class="header">SCREENSHOT</text><line x1="100" y1="1058" x2="660" y2="1058" class="rule"/><text x="100" y="1090" class="key">SUPER + Shift + Print</text><text x="100" y="1116" class="desc">Screenshot (or F12)</text><text x="700" y="240" class="header">WINDOWS</text><line x1="700" y1="252" x2="1260" y2="252" class="rule"/><text x="700" y="284" class="key">SUPER + Alt + Q</text><text x="700" y="310" class="desc">Close window (or Alt+F4)</text><text x="700" y="342" class="key">SUPER + Ctrl + Esc</text><text x="700" y="368" class="desc">Force-kill window</text><text x="700" y="400" class="key">SUPER + F</text><text x="700" y="426" class="desc">Fullscreen (or SUPER+PgUp)</text><text x="700" y="458" class="key">SUPER + Shift + Space</text><text x="700" y="484" class="desc">Toggle floating</text><text x="700" y="516" class="key">SUPER + Space</text><text x="700" y="542" class="desc">Cycle windows</text><text x="700" y="574" class="key">SUPER + Shift + C</text><text x="700" y="600" class="desc">Reload Hyprland config</text><text x="700" y="632" class="key">SUPER + Shift + E</text><text x="700" y="658" class="desc">Exit session</text><text x="700" y="730" class="header">MOUSE</text><line x1="700" y1="742" x2="1260" y2="742" class="rule"/><text x="700" y="774" class="key">SUPER + Drag L/R-click</text><text x="700" y="800" class="desc">Move / resize floating win.</text><text x="700" y="872" class="header">SCRATCHPAD</text><line x1="700" y1="884" x2="1260" y2="884" class="rule"/><text x="700" y="916" class="key">SUPER + Minus</text><text x="700" y="942" class="desc">Send window to scratchpad</text><text x="700" y="974" class="key">SUPER + Shift + Minus</text><text x="700" y="1000" class="desc">Toggle scratchpad</text><text x="1300" y="240" class="header">FOCUS</text><line x1="1300" y1="252" x2="1860" y2="252" class="rule"/><text x="1300" y="284" class="key">SUPER + Left</text><text x="1300" y="310" class="desc">Focus window left</text><text x="1300" y="342" class="key">SUPER + Right</text><text x="1300" y="368" class="desc">Focus window right</text><text x="1300" y="400" class="key">SUPER + Up</text><text x="1300" y="426" class="desc">Focus window up</text><text x="1300" y="458" class="key">SUPER + Down</text><text x="1300" y="484" class="desc">Focus window down (Alt also works)</text><text x="1300" y="556" class="header">MOVE WINDOWS</text><line x1="1300" y1="568" x2="1860" y2="568" class="rule"/><text x="1300" y="600" class="key">SUPER + Shift + Left/Right</text><text x="1300" y="626" class="desc">Move to prev/next monitor</text><text x="1300" y="658" class="key">SUPER + Shift + H/J/K/L</text><text x="1300" y="684" class="desc">Move window (vim keys)</text><text x="1300" y="756" class="header">KEYBOARD LAYOUT</text><line x1="1300" y1="768" x2="1860" y2="768" class="rule"/><text x="1300" y="800" class="key">SUPER + Alt + K</text><text x="1300" y="826" class="desc">Next keyboard layout</text><text x="1300" y="858" class="key">SUPER + Alt + P</text><text x="1300" y="884" class="desc">Previous keyboard layout</text><text x="1300" y="956" class="header">RESIZE MODE</text><line x1="1300" y1="968" x2="1860" y2="968" class="rule"/><text x="1300" y="1000" class="key">SUPER + R</text><text x="1300" y="1026" class="desc">Enter resize mode</text><text x="1300" y="1058" class="key">H / J / K / L / arrows</text><text x="1300" y="1084" class="desc">Resize active window</text><text x="1300" y="1116" class="key">Return / Esc</text><text x="1300" y="1142" class="desc">Exit resize mode</text><text x="1900" y="240" class="header">WORKSPACES</text><line x1="1900" y1="252" x2="2460" y2="252" class="rule"/><text x="1900" y="284" class="key">SUPER + 1..0</text><text x="1900" y="310" class="desc">Switch to workspace 1-10</text><text x="1900" y="342" class="key">SUPER + Shift + 1..0</text><text x="1900" y="368" class="desc">Move window to workspace</text><text x="1900" y="400" class="key">SUPER + Ctrl + arrows</text><text x="1900" y="426" class="desc">Switch workspace +-1</text><text x="1900" y="458" class="key">SUPER + Ctrl + Shift + L/R</text><text x="1900" y="484" class="desc">Move window to workspace +-1</text><text x="1900" y="556" class="header">WINDOW SWITCHING</text><line x1="1900" y1="568" x2="2460" y2="568" class="rule"/><text x="1900" y="600" class="key">Alt+Tab / SUPER+Tab</text><text x="1900" y="626" class="desc">Cycle windows (+Shift = rev.)</text><text x="1900" y="698" class="header">VOLUME / BRIGHTNESS / MEDIA</text><line x1="1900" y1="710" x2="2460" y2="710" class="rule"/><text x="1900" y="742" class="key">Volume Up / Down</text><text x="1900" y="768" class="desc">Volume +-5% (on-screen bar)</text><text x="1900" y="800" class="key">Shift + Volume Up/Down</text><text x="1900" y="826" class="desc">Volume +-1% (fine control)</text><text x="1900" y="858" class="key">Mute / Mic Mute</text><text x="1900" y="884" class="desc">Toggle speaker / mic mute</text><text x="1900" y="916" class="key">F9</text><text x="1900" y="942" class="desc">Push-to-mute mic (Discord etc.)</text><text x="1900" y="974" class="key">Play / Next / Prev</text><text x="1900" y="1000" class="desc">Media playback control</text><text x="1900" y="1032" class="key">Rewind / Forward</text><text x="1900" y="1058" class="desc">Seek -+5s in track</text><text x="1900" y="1090" class="key">Brightness Up / Down</text><text x="1900" y="1116" class="desc">Brightness +-5%</text><text x="1900" y="1148" class="key">Shift + Brightness</text><text x="1900" y="1174" class="desc">Brightness +-1% (fine)</text>

  <text x="1280" y="1400" text-anchor="middle" class="footer">Reload config after edits: SUPER+Shift+C  or  hyprctl reload   ·   ~/nixcfg/configs/hyprland</text>
</svg>
