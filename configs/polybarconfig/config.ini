; polybar -- the X11 stand-in for waybar. Module order, colours and glyphs are
; taken from configs/waybarconfig/config and configs/waybarconfig/style.css;
; waybar is Wayland-only (it is a layer-shell client), so none of that file
; can be reused directly.
;
; The icons are Nerd Font glyphs (installed by nixos/fonts.nix).
; They live in the Unicode private use area, so they look like blanks in any
; editor lacking the font -- that is expected, not corruption. To identify one,
; run the line through `hexdump -C` and look the codepoint up on
; nerdfonts.com/cheat-sheet.

[colors]
background     = #000000
foreground     = #ffffff
; style.css's modules-right palette, kept name for name.
clock          = #454f57
battery        = #3d4245
battery-charge = #2f6048
battery-crit   = #6e2626
network        = #2d3436
network-down   = #6b2020
audio          = #6b5424
audio-muted    = #3a4446
bluetooth      = #2f4a63
dolphin        = #3a5f4c
monitors       = #4a3a5f
monitors-dim   = #b0a8bb
tray           = #33393d
power          = #000000
dim            = #777777
text-soft      = #e8e8e8
text-muted     = #9aa3a5

[bar/main]
; "position": "bottom", "height": 30
bottom = true
height = 30
width  = 100%

; waybar draws one bar per output by default. polybar does not -- see
; scripts/polybar_launch.sh, which starts one process per connected monitor.
monitor = ${env:MONITOR:}

background = ${colors.background}
foreground = ${colors.foreground}

; "spacing": 4 -- waybar's gap between modules.
module-margin = 2
padding = 0

; style.css: font-family "Noto Sans", "Symbols Nerd Font"; font-size 13px.
; Symbols Nerd Font sits second so it is reached only as a fallback for the
; private-use codepoints, exactly as in the CSS.
font-0 = Noto Sans:size=10;2
font-1 = Symbols Nerd Font:size=11;3
; #network uses "DejaVu Sans Mono" so the four block glyphs keep a consistent
; baseline and width.
font-2 = DejaVu Sans Mono:size=10;2

modules-left   = workspaces mode
modules-center = xwindow
modules-right  = dolphin audiosink pulseaudio bluetooth monitors network battery clock power

; waybar's "tray" module. polybar hosts the tray in the bar itself, not as a
; module, so it cannot be placed between "clock" and the power button the way
; waybar had it -- it always sits at the very end of the bar. The tray reserves
; its own width, so the modules simply shift left to make room.
tray-position = right
tray-background = ${colors.tray}
tray-spacing = 10

cursor-click  = pointer
cursor-scroll = ns-resize

enable-ipc = true

; ---------------------------------------------------------------------------
; modules-left
; ---------------------------------------------------------------------------

; waybar's "hyprland/workspaces" with format "{id} {windows}" and the
; window-rewrite icon map. polybar's internal/i3 module can only print the
; workspace name, so the whole thing -- icons, per-state colours and the
; click-to-activate action -- is generated by a script instead. It tails the
; i3 IPC, so it updates on the event rather than on a poll.
[module/workspaces]
type = custom/script
exec = ~/nixcfg/scripts/i3_workspaces.sh
tail = true

; waybar's "hyprland/submap" -- the name of the active binding mode, i.e.
; "resize". internal/i3 is used for nothing else here.
[module/mode]
type = internal/i3
format = <label-mode>
label-mode = %mode%
label-mode-padding = 2
label-mode-background = #64727D
label-mode-foreground = ${colors.foreground}

; ---------------------------------------------------------------------------
; modules-center
; ---------------------------------------------------------------------------

; waybar's "hyprland/window".
[module/xwindow]
type = internal/xwindow
label = %title%
label-maxlen = 80

; ---------------------------------------------------------------------------
; modules-right
; ---------------------------------------------------------------------------

[module/dolphin]
type = custom/text
format = 
format-padding = 2
format-background = ${colors.dolphin}
format-foreground = ${colors.text-soft}
click-left = dolphin

; waybar's "custom/audiosink". Which output the volume knob controls -- i.e.
; the default sink. Sits next to pulseaudio on purpose: that module shows the
; *level*, this one shows the *device*.
;
; scripts/audio_sink.sh is shared with the Wayland session and still speaks
; waybar's JSON, so polybar_json.sh pulls the "text" field out of each line.
; The script streams continuously, hence tail = true and no interval.
[module/audiosink]
type = custom/script
exec = ~/nixcfg/scripts/polybar_json.sh ~/nixcfg/scripts/audio_sink.sh waybar
tail = true
format-padding = 2
format-background = ${colors.audio}
format-foreground = ${colors.text-soft}
click-left  = ~/nixcfg/scripts/audio_sink.sh menu
click-right = ~/nixcfg/scripts/audio_sink.sh next
scroll-up   = ~/nixcfg/scripts/audio_sink.sh next
scroll-down = ~/nixcfg/scripts/audio_sink.sh next

[module/pulseaudio]
type = internal/pulseaudio
; "scroll-step": 5
interval = 5
use-ui-max = false

format-volume = <ramp-volume> <label-volume>
format-volume-padding = 2
format-volume-background = ${colors.audio}
format-volume-foreground = ${colors.text-soft}
label-volume = %percentage%%

; style.css #pulseaudio.muted
format-muted = <label-muted>
format-muted-padding = 2
format-muted-background = ${colors.audio-muted}
format-muted-foreground = ${colors.text-muted}
label-muted =  %percentage%%

; waybar format-icons default: three volume glyphs, low to high.
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

click-right = pavucontrol

[module/bluetooth]
type = internal/bluetooth
format-connected = <label-connected>
format-connected-padding = 2
format-connected-background = ${colors.bluetooth}
format-connected-foreground = ${colors.text-soft}
label-connected = 

format-disconnected = <label-disconnected>
format-disconnected-padding = 2
format-disconnected-background = ${colors.bluetooth}
format-disconnected-foreground = ${colors.text-soft}
label-disconnected = 

click-left = ~/nixcfg/scripts/focus_or_launch_x11.sh blueman-manager blueman-manager

; waybar's "custom/monitors". Which displays are switched on: the tile counts
; how many of the connected outputs are active, clicking it opens a rofi list
; for turning them on and off, and that choice is remembered across logins --
; see scripts/monitors_x11.sh.
;
; waybar polled this every 30 s and took RTMIN+8 to refresh early. polybar
; script modules have no signal, so the `polybar` subcommand runs as a loop
; that prints only when the output set actually changes, and tail = true reads
; it. Same effect, one less moving part.
[module/monitors]
type = custom/script
exec = ~/nixcfg/scripts/monitors_x11.sh polybar
tail = true
format-padding = 2
format-background = ${colors.monitors}
format-foreground = ${colors.text-soft}
click-left  = ~/nixcfg/scripts/monitors_x11.sh menu
click-right = arandr

; 4-bar wifi meter. Deliberately NOT a Nerd Font glyph: the icon fonts only
; offer a single fixed wifi symbol, so the bars are Unicode block elements
; (U+2581/2583/2585/2587) with the inactive ones dimmed. waybar did the
; dimming with Pango markup; polybar uses its own %{F...} format tags, and
; ramp-signal is indexed by signal strength just as format-icons was.
[module/network]
type = internal/network
interface = wlp1s0
interface-type = wireless
interval = 5

format-connected = <ramp-signal>
format-connected-padding = 2
format-connected-background = ${colors.network}
format-connected-foreground = ${colors.foreground}
; font-2, so the four blocks keep a consistent baseline and width.
format-connected-font = 3

format-disconnected = <label-disconnected>
format-disconnected-padding = 2
format-disconnected-background = ${colors.network-down}
format-disconnected-font = 3
label-disconnected = %{F#777777}▁▃▅▇%{F-}

ramp-signal-0 = %{F#777777}▁▃▅▇%{F-}
ramp-signal-1 = ▁%{F#777777}▃▅▇%{F-}
ramp-signal-2 = ▁▃%{F#777777}▅▇%{F-}
ramp-signal-3 = ▁▃▅%{F#777777}▇%{F-}
ramp-signal-4 = ▁▃▅▇

click-left = kitty -e nmtui

[module/battery]
type = internal/battery
; Host-specific, and polybar has no autodetect: check /sys/class/power_supply.
; waybar needed neither -- it picked the battery up on its own and only named
; "BAT2" for the framework's second one, which has no polybar counterpart
; either (one module, one battery).
battery = BAT1
adapter = ACAD
; "warning": 30 has no polybar equivalent -- only the critical threshold does.
low-at = 15
poll-interval = 5

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-padding = 2
format-discharging-background = ${colors.battery}
format-discharging-foreground = ${colors.text-soft}
label-discharging = %percentage%%

format-charging = <label-charging>
format-charging-padding = 2
format-charging-background = ${colors.battery-charge}
format-charging-foreground = ${colors.text-soft}
label-charging =  %percentage%%

format-full = <ramp-capacity> <label-full>
format-full-padding = 2
format-full-background = ${colors.battery}
format-full-foreground = ${colors.text-soft}
label-full = %percentage%%

; style.css #battery.critical:not(.charging) blinks between #6e2626 and
; #8f3a3a. polybar animates by cycling frames rather than by CSS keyframes,
; so the two colours are two animation frames.
format-low = <animation-low> <label-low>
format-low-padding = 2
format-low-foreground = ${colors.foreground}
label-low = %percentage%%
animation-low-0 = 
animation-low-0-background = ${colors.battery-crit}
animation-low-1 = 
animation-low-1-background = #8f3a3a
animation-low-framerate = 500

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

[module/clock]
type = internal/date
interval = 1
; waybar: " {:%d.%m.%Y | %H:%M}"
label =  %date%
date = %d.%m.%Y | %H:%M
format-padding = 2
format-background = ${colors.clock}
format-foreground = ${colors.foreground}
click-left = rofi -dmenu -l 0 -p 'Calendar' -theme-str '* {font: "monospace 12";}' -mesg "$(cal -3)"

; waybar's "custom/power". Its menu-actions are a waybar feature with no
; polybar counterpart, so the same four entries live in a rofi menu instead --
; which is also what Ctrl+Alt+Del opens.
[module/power]
type = custom/text
format = 
format-padding = 2
format-background = ${colors.power}
format-foreground = ${colors.foreground}
click-left = ~/nixcfg/scripts/powermenu.sh

