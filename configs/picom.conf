# picom -- the compositor half of Hyprland's `decoration` block. Hyprland
# composites its own windows; i3 does not composite at all, so without picom
# there is no blur, no per-window opacity, and no fullscreen bypass.
#
# Every value here comes from the hl.config({...}) call in configs/hyprland.lua.

# decoration.blur = { enabled = true, size = 5, passes = 2 }
# dual_kawase is the multi-pass kawase blur, which is the algorithm Hyprland's
# size/passes pair describes; picom rolls both numbers into one strength.
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
# Do not blur behind the bar, the wallpaper or a fullscreen game.
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "_NET_WM_STATE@[*] *= '_NET_WM_STATE_FULLSCREEN'"
];

# decoration.active_opacity = 1.0 / inactive_opacity = 0.9
active-opacity = 1.0;
inactive-opacity = 0.9;
# Without this, the 0.9 also dims a window that is merely unfocused-but-visible
# in a way Hyprland does not -- docks and the desktop are never "inactive".
inactive-opacity-override = false;
opacity-rule = [
  "100:window_type = 'dock'",
  "100:window_type = 'desktop'",
  "100:_NET_WM_STATE@[*] *= '_NET_WM_STATE_FULLSCREEN'"
];

# decoration.rounding = 0
corner-radius = 0;

# general.allow_tearing = true. picom has no per-window `immediate` rule the
# way hyprland.lua's steam-games-fullscreen does, so this is all or nothing:
# vsync off trades a visible tear line for lower input latency everywhere.
vsync = false;

# render.direct_scanout = 2 (auto). picom's version of handing a fullscreen
# window straight to the display controller is to stop compositing for it
# entirely, which is what unredirection does.
unredir-if-possible = true;

# animations.enabled = false
fading = false;

# Hyprland draws no drop shadows and none were configured.
shadow = false;

backend = "glx";
use-damage = true;
