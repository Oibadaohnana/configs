# Ctrl+Backspace = delete whole word (kitty sends plain DEL for both
# backspace and ctrl+backspace by default, so map it to send ^W explicitly,
# which zshrc binds to backward-kill-word)
map ctrl+backspace send_text all \x17

background #000000
foreground #d0d0d0
cursor     #d0d0d0

# normal colors
color0  #000000
color1  #e25b5b
color2  #21db14
color3  #e6d36d
color4  #5da9e2
color5  #d17ad1
color6  #63c6c6
color7  #d0d0d0

# bright colors
color8  #6b6b6b
color9  #ff8787
color10 #5cf24d
color11 #ffe999
color12 #8ec9f5
color13 #e6a6e6
color14 #96e0e0
color15 #ffffff

# JetBrains Mono's Bold is barely heavier than its Regular at this size, so
# ESC[1m text (micro's **strong**, prompt highlights) reads as plain. ExtraBold
# is visibly heavier. The family="..." style="..." spelling is required -- a
# bare "JetBrainsMono Nerd Font ExtraBold" silently falls back to Regular.
font_family      family="JetBrainsMono Nerd Font"
bold_font        family="JetBrainsMono Nerd Font" style="ExtraBold"
bold_italic_font family="JetBrainsMono Nerd Font" style="ExtraBold Italic"
